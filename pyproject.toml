[project]
name = "llm-memory-maintenance"
version = "0.1.0"
description = "Experimental repository for evaluating conversational memory-maintenance policies under repeated information revisions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub==0.36.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "torch==2.8.0",
    "transformers==4.57.6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
