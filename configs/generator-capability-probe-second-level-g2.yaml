# Selection record. The basis is eligibility against the frozen Sec. 12 criteria, never benchmark ranking,
# prestige, or any expected pass probability. Availability, first-party route and structured-output
# support are researcher-attested at selection time and NOT independently verified offline: the
# capability probe is their first empirical test, and a refusal or unavailability is recorded as a
# capability FAIL, never retried until it passes.
candidate_selection:
  role: second-level G2 candidate (Anthropic-family slot)
  candidate: anthropic/claude-fable-5.1
  identifier_policy: exact immutable identifier; moving aliases (e.g. ~anthropic/claude-fable-latest) and the :batch variant are excluded
  provider_route: first-party Anthropic via provider.order [anthropic] with allow_fallbacks false and require_parameters true (the repository's existing pinning); no OpenRouter multi-provider auto-routing and no Azure/Vertex/Bedrock substitution
  frozen_on: '2026-09-19'
  frozen_before_any_output: true
  basis: Anthropic family; distinct from anthropic/claude-sonnet-5 and anthropic/claude-opus-5; available through OpenRouter with a first-party Anthropic route; structured-output support; exact identifier available
  backup_list: none adopted; any further candidate requires its own written freeze before it is probed
  on_capability_fail: record and stop; no retry-until-pass
