# no output from this candidate has been observed. Same structure and package as the fallback config
# (configs/generator-capability-probe-fallback.yaml); only the candidate identity differs. The shared
# per-slot capability schema identifier is reused unchanged (probe_generators.SLOT_CAPABILITY_SCHEMA).
